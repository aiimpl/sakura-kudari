<title>桜川くだり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --ink:#f3ede2; --dim:#c9c0b0; --glass:rgba(12,14,16,.48); --line:rgba(243,237,226,.22);
  --shu:#c8452e; --gold:#d9b46c; --night:#0b0d10;
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night)}
[hidden]{display:none!important}
body{font-family:var(--sans);color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.hud{position:fixed;text-shadow:0 1px 3px rgba(0,0,0,.55)}
#title{top:calc(18px + env(safe-area-inset-top,0px));left:18px;pointer-events:none}
#title .t{font-family:var(--serif);font-weight:800;font-size:22px;letter-spacing:.2em}
#title .w{font-size:12px;letter-spacing:.24em;color:var(--gold);margin-top:4px}
#wx{bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 32px)}
#wx button{font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--glass);border:1px solid var(--line);padding:7px 13px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#wx button kbd{font-family:var(--sans);color:var(--dim);font-size:11px;margin-right:5px}
#wx button.on{background:var(--shu);border-color:var(--shu)}
#wx button.on kbd{color:#f7d9cf}
#wx button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#keys{bottom:calc(18px + env(safe-area-inset-bottom,0px));left:18px;font-size:12px;color:var(--dim);line-height:1.75;pointer-events:none}
#keys b{color:var(--ink);font-weight:500;display:inline-block;min-width:62px}
#fps{top:calc(18px + env(safe-area-inset-top,0px));right:18px;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;pointer-events:none}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .9s}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(180deg,rgba(8,10,12,.2),rgba(8,10,12,.7));z-index:10}
#start .card{text-align:center;max-width:520px}
#start .eyebrow{font-size:12px;letter-spacing:.42em;color:var(--gold)}
#start h1{font-family:var(--serif);font-weight:800;font-size:clamp(40px,9vw,74px);letter-spacing:.16em;margin:.18em 0 .12em}
#start p{color:var(--dim);font-size:14px;line-height:1.8;margin:0 auto 22px;max-width:30em}
#go{font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:.3em;color:#fff;background:var(--shu);border:0;padding:13px 36px 13px 44px;border-radius:2px;cursor:pointer}
#go:disabled{background:#5a4640;cursor:wait}
#go:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.mobile #keys{display:none}
#knob{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:1px solid var(--line);background:rgba(12,14,16,.25);pointer-events:none}
#knob i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(243,237,226,.5)}
body.clean .hud{display:none!important}
body.idle .hud{opacity:0;transition:opacity .8s}
.hud{transition:opacity .3s}
@media (prefers-reduced-motion: reduce){#fade{transition:none}}
</style>

<canvas id="gl" tabindex="0"></canvas>
<div class="hud" id="title"><div class="t">桜川くだり</div><div class="w" id="wlabel">晴れ ・ 朝</div></div>
<div class="hud" id="fps"></div>
<div class="hud" id="wx">
  <button type="button" data-w="clear"><kbd>1</kbd>朝</button>
  <button type="button" data-w="golden"><kbd>2</kbd>陽光</button>
  <button type="button" data-w="fog"><kbd>3</kbd>霧</button>
  <button type="button" data-w="rain"><kbd>4</kbd>雨</button>
  <button type="button" data-w="dusk"><kbd>5</kbd>夕焼け</button>
  <button type="button" data-w="night"><kbd>6</kbd>夜</button>
  <button type="button" data-w="auto"><kbd>T</kbd>移ろい</button>
</div>
<div class="hud" id="keys">
  <div><b>W / S</b>漕ぐ速さ</div><div><b>A / D</b>舵</div><div><b>ドラッグ</b>視点 ・ ホイールで距離</div><div><b>V</b>映画カメラ　<b>H</b>UIを隠す</div>
</div>
<div id="knob" hidden><i></i></div>
<div id="fade"></div>
<div id="start"><div class="card">

  <h1>桜川くだり</h1>
  <p id="msg">谷を生成しています…</p>
  <button id="go" type="button" disabled>舟を出す</button>
</div></div>

  if(fw||turn){B.autoT=6;}B.autoT-=dt;const auto=B.autoT<=0;
  const tgt=auto?2.6:clamp(2.6+fw*2.3,.4,5);
  const pulse=sendo.state==='push'?1:.55;B.v+=(tgt*(.8+.35*pulse)-B.v)*dt*.7;
  let yawRate;
  if(auto){const za=B.z-18,xa=cx(za);const des=Math.atan2(xa-B.x,za-B.z);yawRate=clamp(wrapA(des-B.yaw)*.9,-.3,.3);}else yawRate=turn*.42*(.35+B.v/4.5);
  B.yawV=lerp(B.yawV,yawRate,Math.min(1,dt*2));B.yaw+=B.yawV*dt;
  B.x+=Math.sin(B.yaw)*B.v*dt;B.z+=Math.cos(B.yaw)*B.v*dt;
  const lat=B.x-cx(B.z),lim=hw(B.z)-3.4;if(Math.abs(lat)>lim){B.x=cx(B.z)+Math.sign(lat)*lim;B.v*=.985;B.yaw+=wrapA(Math.atan2(cx(B.z-10)-B.x,-10)-B.yaw)*dt;}
  const bc=cx(BRIDGE_Z),bw=hw(BRIDGE_Z);if(Math.abs(B.z-BRIDGE_Z)<2.5&&Math.abs(B.x-bc)>bw*.42){B.x=bc+Math.sign(B.x-bc)*bw*.42;}
  if(B.z<-2150)loopRiver();
  const T=U.uTime.value;boat.position.set(B.x,.06+Math.sin(T*1.3)*.03,B.z);boat.rotation.set(.012*Math.sin(T*.9)+(sendo.state==='push'?-.006:0),B.yaw,.018*Math.sin(T*1.1)-B.yawV*.08,'YXZ');
  if(boatLantern){boatLantern.rotation.z=Math.sin(T*1.7)*.06-B.yawV*.3;boatLantern.rotation.x=Math.sin(T*1.3+1)*.05-(B.v-2.6)*.02;}
  boat.updateMatrixWorld(true);}
let looping=false;function loopRiver(){if(looping)return;looping=true;const f=document.getElementById('fade');f.style.opacity=1;setTimeout(()=>{B.z=150;B.x=cx(150);B.yaw=Math.PI;camYaw=Math.PI;sendo.state='push';sendo.planted=false;f.style.opacity=0;looping=false;},950);}
const _v=new V3(),_v2=new V3(),_v3=new V3(),_q=new THREE.Quaternion(),UP=new V3(0,1,0);
function place(mesh,a,b,len){mesh.position.addVectors(a,b).multiplyScalar(.5);_v3.subVectors(b,a);const l=_v3.length();mesh.quaternion.setFromUnitVectors(UP,_v3.normalize());mesh.scale.set(1,l/len,1);}
function ik(S,T,L1,L2,hint,out){const d=clamp(S.distanceTo(T),.05,L1+L2-.001);const dir=_v3.subVectors(T,S).normalize();const a=(L1*L1-L2*L2+d*d)/(2*d);const h=Math.sqrt(Math.max(L1*L1-a*a,0));
  const perp=hint.clone().addScaledVector(dir,-hint.dot(dir)).normalize();return out.copy(S).addScaledVector(dir,a).addScaledVector(perp,h);}
function sendoStep(dt){const s=sendo;const toW=v=>v.applyMatrix4(boat.matrixWorld);const toL=v=>boat.worldToLocal(v);
  const plantL=new V3(-1.12,0,-2.15);// local plant point (right side, ahead of the ferryman)
  if(!s.planted){const w=toW(plantL.clone());w.y=Math.max(H(w.x,w.z),-3.4);s.bottomW.copy(w);s.planted=true;s.state='push';}
  let bL,handL;const zF=-BL/2+.72;
  if(s.state==='push'){bL=toL(s.bottomW.clone());const back=clamp((bL.z-plantL.z)/-2.6,0,1);handL=new V3(-.42,STERN_DECK+1.25-back*.05,zF+.35-back*.75);
    if(bL.z<zF-1.9||bL.distanceTo(handL)>5.2){s.state='lift';s.t=0;s.liftFrom=bL.clone();}}
  if(s.state==='lift'){s.t+=dt/1.15;const e=s.t*s.t*(3-2*s.t);bL=s.liftFrom.clone().lerp(new V3(plantL.x,-.6,plantL.z),e);bL.y+=Math.sin(Math.PI*s.t)*1.4;bL.x-=Math.sin(Math.PI*s.t)*.3;
    handL=new V3(-.42,STERN_DECK+1.25+Math.sin(Math.PI*s.t)*.25,lerp(zF-.4,zF+.35,e));
    if(s.t>=1){const w=toW(plantL.clone());w.y=Math.max(H(w.x,w.z),-3.4);s.bottomW.copy(w);s.state='push';waterU.uPole.value.set(w.x,w.z,U.uTime.value,1);AU.splash();}}
  const bW=toW(bL.clone()),hW=toW(handL.clone());const dir=_v.subVectors(hW,bW).normalize();const top=bW.clone().addScaledVector(dir,6);place(s.pole,bW,top,6);
  const push=s.state==='push'?clamp((toL(s.bottomW.clone()).z-plantL.z)/-2.6,0,1):0;
  s.torso.rotation.set(.08+push*.2-(s.state==='lift'?.06:0),-.3,-.05);s.hips.rotation.set(0,.2,0);s.head.rotation.set(-.15-push*.2,.35,0);
  s.legs[0][0].rotation.x=-.35-push*.2;s.legs[0][1].rotation.x=.55+push*.2;s.legs[1][0].rotation.x=.25;s.legs[1][1].rotation.x=.2;
  s.root.updateMatrixWorld(true);
  const g1=hW.clone(),g2=hW.clone().addScaledVector(dir,-.42);
  for(let i=0;i<2;i++){const S=s.sh[i].clone().applyMatrix4(s.torso.matrixWorld);const Tg=i===0?g2:g1;const hint=_v2.set(0,-1,0).addScaledVector(new V3(Math.sin(B.yaw),0,Math.cos(B.yaw)),-.5);
    const E=ik(S,Tg,.3,.28,hint,new V3());const[u,f,h]=s.arm[i];place(u,S,E,.36);place(f,E,Tg,.33);h.position.copy(Tg);
    [u,f,h].forEach(o=>{o.parent!==scene&&scene.attach(o);});}}
// arms were created as boat children; move them to scene space once
sendo.arm.forEach(a=>a.forEach(o=>scene.attach(o)));

const _hideM=new THREE.Matrix4().makeScale(0,0,0);
function propsStep(dt){const T=U.uTime.value,d=new THREE.Object3D();
  // petals
  const wind=W.wind,active=Math.floor(PETALS*W.petal);
  for(let i=0;i<PETALS;i++){const p=petals[i];if(i>=active){d.position.set(0,-99,0);d.scale.setScalar(0);d.updateMatrix();petalMesh.setMatrixAt(i,d.matrix);continue;}
    if(p.float>0){p.float-=dt;p.z-=.5*dt;p.x+=Math.sin(T*.3+p.ph)*.05*dt;p.y=.03;if(p.float<=0)spawnPetal(p);}
    else{p.ph+=dt*p.rs;p.x+=(p.vx+Math.sin(p.ph)*.6+.5*wind)*dt;p.z+=(p.vz+Math.cos(p.ph*.7)*.5+.3*wind)*dt;p.y-=(.55+W.rain*1.5)*dt;p.rx+=dt*p.rs*2;p.rz+=dt*p.rs;
      const g=H(p.x,p.z);if(p.y<Math.max(g,0)){if(g<0){p.float=R(15,40);p.y=.03;p.rx=Math.PI/2;p.rz=R(0,6);}else spawnPetal(p);}}
    if(Math.abs(p.x-B.x)>70||Math.abs(p.z-B.z)>90||(p.float<=0&&camera.position.distanceToSquared(_v3.set(p.x,p.y,p.z))<16))spawnPetal(p);
    d.position.set(p.x,p.y,p.z);d.rotation.set(p.float>0?-Math.PI/2:p.rx,p.rz,0);d.scale.setScalar(1);d.updateMatrix();petalMesh.setMatrixAt(i,d.matrix);}
  petalMesh.instanceMatrix.needsUpdate=true;
  // floating lanterns
  if(lanterns.visible){for(let i=0;i<LAN;i++){const l=lanS[i];l.z-=.45*dt;if(l.z<B.z-330||l.z>B.z+80){l.z=B.z-R(200,330);l.o=R(-.8,.8);}
      const x=cx(l.z)+l.o*(hw(l.z)-4);d.position.set(x,.02+Math.sin(T*1.2+l.ph)*.03,l.z);d.rotation.set(Math.sin(T+l.ph)*.05,l.ph+T*.05,Math.cos(T*.8+l.ph)*.05);d.scale.setScalar(1);d.updateMatrix();(i%5<3?lanterns:lanterns2).setMatrixAt(i,d.matrix);(i%5<3?lanterns2:lanterns).setMatrixAt(i,_hideM);}
    lanterns.instanceMatrix.needsUpdate=true;lanterns2.instanceMatrix.needsUpdate=true;}
  if(fireflies.visible){let ch=false;for(let i=0;i<FF;i++){const z=ffPos[i*3+2];if(z>B.z+50||z<B.z-240){placeFF(i);ch=true;}}if(ch)ffGeo.attributes.position.needsUpdate=true;}}

// ---------- input ----------
addEventListener('keydown',e=>{keys[e.code]=true;if(!started)return;const n={Digit1:'clear',Digit2:'golden',Digit3:'fog',Digit4:'rain',Digit5:'dusk',Digit6:'night'}[e.code];if(n)setWeather(n);
  if(e.code==='KeyT')setWeather('auto');if(e.code==='KeyV')cine=!cine;if(e.code==='KeyH')document.body.classList.toggle('clean');});
addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
document.querySelectorAll('#wx button').forEach(b=>b.addEventListener('click',()=>{setWeather(b.dataset.w);canvas.focus();}));
let drag=false,mx=0,my=0;canvas.addEventListener('mousedown',e=>{drag=true;mx=e.clientX;my=e.clientY;canvas.focus();});addEventListener('mouseup',()=>drag=false);
addEventListener('mousemove',e=>{if(!drag)return;camYaw-=(e.clientX-mx)*.005;camPitch=clamp(camPitch+(e.clientY-my)*.004,-.05,1.1);mx=e.clientX;my=e.clientY;userT=4;});
canvas.addEventListener('wheel',e=>{camDistT=clamp(camDistT*(1+Math.sign(e.deltaY)*.1),5,40);e.preventDefault();},{passive:false});
const knob=document.getElementById('knob'),knobI=knob.querySelector('i');
canvas.addEventListener('touchstart',e=>{for(const t of e.changedTouches){if(t.clientX<innerWidth*.45&&joy.id===null){joy.id=t.identifier;joy.ox=t.clientX;joy.oy=t.clientY;joy.x=joy.y=0;knob.hidden=false;knob.style.left=t.clientX+'px';knob.style.top=t.clientY+'px';knobI.style.transform='';}
  else if(lookId===null){lookId=t.identifier;lx=t.clientX;ly=t.clientY;}}e.preventDefault();},{passive:false});
canvas.addEventListener('touchmove',e=>{for(const t of e.changedTouches){if(t.identifier===joy.id){let dx=t.clientX-joy.ox,dy=t.clientY-joy.oy;const d=Math.hypot(dx,dy);if(d>48){dx*=48/d;dy*=48/d;}joy.x=dx/48;joy.y=dy/48;knobI.style.transform=`translate(${dx}px,${dy}px)`;}
  else if(t.identifier===lookId){camYaw-=(t.clientX-lx)*.007;camPitch=clamp(camPitch+(t.clientY-ly)*.005,-.05,1.1);lx=t.clientX;ly=t.clientY;userT=4;}}e.preventDefault();},{passive:false});
const endT=e=>{for(const t of e.changedTouches){if(t.identifier===joy.id){joy.id=null;joy.x=joy.y=0;knob.hidden=true;}if(t.identifier===lookId)lookId=null;}};canvas.addEventListener('touchend',endT);canvas.addEventListener('touchcancel',endT);

// ---------- camera ----------
const camT=new V3();
function cameraStep(dt){camDist=lerp(camDist,cine?17:camDistT,Math.min(1,dt*2));userT-=dt;
  if(cine){camYaw+=dt*.07;camPitch=lerp(camPitch,.1+.08*Math.sin(U.uTime.value*.05),dt);}else if(userT<=0)camYaw+=wrapA(B.yaw-.32-camYaw)*Math.min(1,dt*.8);
  camT.lerp(_v.set(B.x,1.5,B.z),Math.min(1,dt*6));const cp=Math.cos(camPitch);let x=camT.x-Math.sin(camYaw)*camDist*cp,z=camT.z-Math.cos(camYaw)*camDist*cp,y=camT.y+camDist*Math.sin(camPitch);
  y=Math.max(y,Math.max(H(x,z),0)+.6);camera.position.set(x,y,z);camera.lookAt(camT);}

const clock=new THREE.Clock();let fN=0,fT=0;const fpsEl=document.getElementById('fps');const invProj=new THREE.Matrix4();
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);U.uTime.value+=dt;
  stepWeather(dt);boatStep(dt);sendoStep(dt);propsStep(dt);birdsStep(dt);cameraStep(dt);
  waterU.uBoat.value.set(B.x,B.z,B.v);waterU.uBoatDir.value.set(Math.sin(B.yaw),Math.cos(B.yaw));
  blades.forEach(b=>b.material.uniforms.uCam.value.copy(camera.position));rain.material.uniforms.uC.value.copy(camera.position);
  sky.position.copy(camera.position);
  sunLight.target.position.set(Math.round(B.x),0,Math.round(B.z));sunLight.position.copy(sunLight.target.position).addScaledVector(W.sun,300);
  camera.updateMatrixWorld();renderReflection();
  const au=atmos.uniforms;au.uInvProj.value.copy(camera.projectionMatrixInverse);au.uCamWorld.value.copy(camera.matrixWorld);au.uCamPos.value.copy(camera.position);au.tScene.value=rt.texture;au.tDepth.value=rt.depthTexture;
  const sp=_v.copy(camera.position).addScaledVector(W.sun,1000).project(camera);au.uSunUV.value.set(sp.x*.5+.5,sp.y*.5+.5);
  const fwd=camera.getWorldDirection(_v2);au.uSunVis.value=smooth(-.15,.3,fwd.dot(W.sun))*smooth(3.4,1.2,Math.max(Math.abs(sp.x),Math.abs(sp.y)));
  renderer.shadowMap.needsUpdate=true;renderer.setRenderTarget(rt);renderer.render(scene,camera);renderer.setRenderTarget(null);composer.render();AU.update(dt);
  fN++;fT+=dt;if(fT>.5){fpsEl.textContent=`${Math.round(fN/fT)} fps`;fN=0;fT=0;}}

const gen=Math.round(performance.now()-t0);

const go=document.getElementById('go');go.disabled=false;go.focus();
let idleT=0;const wake=()=>{idleT=0;document.body.classList.remove('idle');};['mousemove','keydown','touchstart','wheel'].forEach(ev=>addEventListener(ev,wake,{passive:true}));setInterval(()=>{if(started&&(idleT+=.5)>4)document.body.classList.add('idle');},500);
