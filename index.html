<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />

<title>桜川くだり</title>
<link rel="stylesheet" href="./fonts/fonts.css" />
<style>
  :root {
    color-scheme: dark;
    --ink: #f3ede2;
    --dim: #c9c0b0;
    --glass: rgba(12, 14, 16, 0.48);
    --line: rgba(243, 237, 226, 0.22);
    --shu: #c8452e;
    --gold: #d9b46c;
    --night: #0b0d10;
    --serif: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  }
  html,
  body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--night);
  }
  [hidden] {
    display: none !important;
  }
  body {
    font-family: var(--sans);
    color: var(--ink);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #gl {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    outline: none;
  }
  .hud {
    position: fixed;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
  }
  #title {
    top: calc(18px + env(safe-area-inset-top, 0px));
    left: 18px;
    pointer-events: none;
  }
  #title .t {
    font-family: var(--serif);
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 0.2em;
  }
  #title .w {
    font-size: 12px;
    letter-spacing: 0.24em;
    color: var(--gold);
    margin-top: 4px;
  }
  #wx {
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: calc(100% - 32px);
  }
  #wx button {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--ink);
    background: var(--glass);
    border: 1px solid var(--line);
    padding: 7px 13px;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  #wx button kbd {
    font-family: var(--sans);
    color: var(--dim);
    font-size: 11px;
    margin-right: 5px;
  }
  #wx button.on {
    background: var(--shu);
    border-color: var(--shu);
  }
  #wx button.on kbd {
    color: #f7d9cf;
  }
  #wx button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
  #keys {
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    left: 18px;
    font-size: 12px;
    color: var(--dim);
    line-height: 1.75;
    pointer-events: none;
  }
  #keys b {
    color: var(--ink);
    font-weight: 500;
    display: inline-block;
    min-width: 62px;
  }
  #fps {
    top: calc(18px + env(safe-area-inset-top, 0px));
    right: 18px;
    font-size: 11px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }
  #fade {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.9s;
  }
  #start {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: linear-gradient(180deg, rgba(8, 10, 12, 0.2), rgba(8, 10, 12, 0.7));
    z-index: 10;
  }
  #start .card {
    text-align: center;
    max-width: 520px;
  }
  #start .eyebrow {
    font-size: 12px;
    letter-spacing: 0.42em;
    color: var(--gold);
  }
  #start h1 {
    font-family: var(--serif);
    font-weight: 800;
    font-size: clamp(40px, 9vw, 74px);
    letter-spacing: 0.16em;
    margin: 0.18em 0 0.12em;
  }
  #start p {
    color: var(--dim);
    font-size: 14px;
    line-height: 1.8;
    margin: 0 auto 22px;
    max-width: 30em;
  }
  #go {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 0.3em;
    color: #fff;
    background: var(--shu);
    border: 0;
    padding: 13px 36px 13px 44px;
    border-radius: 2px;
    cursor: pointer;
  }
  #go:disabled {
    background: #5a4640;
    cursor: wait;
  }
  #go:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }
  .mobile #keys {
    display: none;
  }
  #knob {
    position: fixed;
    width: 110px;
    height: 110px;
    margin: -55px 0 0 -55px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(12, 14, 16, 0.25);
    pointer-events: none;
  }
  #knob i {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 44px;
    height: 44px;
    margin: -22px 0 0 -22px;
    border-radius: 50%;
    background: rgba(243, 237, 226, 0.5);
  }
  body.clean .hud {
    display: none !important;
  }
  body.idle .hud {
    opacity: 0;
    transition: opacity 0.8s;
  }
  .hud {
    transition: opacity 0.3s;
  }
  @media (prefers-reduced-motion: reduce) {
    #fade {
      transition: none;
    }
  }
</style>

<div id="start">
  <div class="card">
    <div class="eyebrow">OPUS 5.5 再現ビルド</div>
    <h1>桜川くだり</h1>
    <p id="msg">谷を生成しています…</p>
    <button id="go" type="button" disabled>舟を出す</button>

<script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
</script>
<script type="module">
  // ============================================================
  // 桜川くだり
  // 苫舟で日本の川を下る three.js シーン。HTML 1ファイル。
  // 画像・3Dモデル・音声ファイルは使わず、地形・草・木・水・人物・
  // 天気・効果音まで、すべてこのコードの中で生成している。
  //
  // 読む順のおすすめ：
  //   谷と川の形 → 水面 → 舟 → 天気 → 仕上げの画面処理 → メインループ
  // ============================================================

  import * as THREE from "three";
  import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
  import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
  import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
  import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
  import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
  import { FXAAShader } from "three/addons/shaders/FXAAShader.js";
  import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

  const V3 = THREE.Vector3;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v),
    lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (e0, e1, x) => {
    const t = clamp((x - e0) / (e1 - e0), 0, 1);
    return t * t * (3 - 2 * t);
  };
  const wrapA = (a) => {
    while (a > Math.PI) a -= 2 * Math.PI;
    while (a < -Math.PI) a += 2 * Math.PI;
    return a;
  };
  let _s = 20260925;
  const rand01 = () => {
    _s |= 0;
    _s = (_s + 0x6d2b79f5) | 0;
    let t = Math.imul(_s ^ (_s >>> 15), 1 | _s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const isMobile = matchMedia("(pointer:coarse)").matches || /Android|iPhone|iPad/i.test(navigator.userAgent);
  if (isMobile) document.body.classList.add("mobile");
  const quality = isMobile
    ? {
        cell: 4,
        pr: Math.min(devicePixelRatio, 1.25),
        reeds: 90000,
        grass: 90000,
        far: 50000,
        sugi: 3000,
        shadow: 1024,
        refl: 0.35,
      }
    : {
        cell: 3,
        pr: Math.min(devicePixelRatio, 1.5),
        reeds: 210000,
        grass: 200000,
        far: 120000,
        sugi: 6500,
        shadow: 2048,
        refl: 0.5,
      };

  // ============================================================
  // ノイズ関数
  // 地形や木の配置に使う疑似乱数と、なめらかな値ノイズ（fbm / ridged）。
  // ============================================================
  function hash2(ix, iz, s) {
    let h = Math.imul(ix, 374761393) ^ Math.imul(iz, 668265263) ^ Math.imul(s, 1442695041);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function vnoise(x, z, s) {
    const ix = Math.floor(x),
      iz = Math.floor(z),
      fx = x - ix,
      fz = z - iz,
      ux = fx * fx * (3 - 2 * fx),
      uz = fz * fz * (3 - 2 * fz);
    const a = hash2(ix, iz, s),
      b = hash2(ix + 1, iz, s),
      c = hash2(ix, iz + 1, s),
      d = hash2(ix + 1, iz + 1, s);
    return (a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz) * 2 - 1;
  }
  function fbm(x, z, o, s) {
    let v = 0,
      a = 0.5,
      n = 0;
    for (let i = 0; i < o; i++) {
      v += a * vnoise(x, z, s + i * 17);
      n += a;
      a *= 0.5;
      const nx = (0.8 * x - 0.6 * z) * 2.03,
        nz = (0.6 * x + 0.8 * z) * 2.03;
      x = nx;
      z = nz;
    }
    return v / n;
  }
  function ridged(x, z, o, s) {
    let v = 0,
      a = 0.5,
      n = 0;
    for (let i = 0; i < o; i++) {
      let r = 1 - Math.abs(vnoise(x, z, s + i * 31));
      r *= r;
      v += a * r;
      n += a;
      a *= 0.5;
      const nx = (0.8 * x - 0.6 * z) * 2.1,
        nz = (0.6 * x + 0.8 * z) * 2.1;
      x = nx;
      z = nz;
    }
    return v / n;
  }

  // ============================================================
  // 谷と川の形
  // 川の中心線 riverCenterX(z) と川幅 riverHalfWidth(z) を決め、そこから高さ heightFn(x,z) を作る。
  // 高さは格子に焼き込み、groundAt(x,z) で補間して引く。地面の色と草の密度もここで決める。
  // ============================================================
  const riverCenterX = (z) => 34 * Math.sin(z * 0.0085) + 14 * Math.sin(z * 0.019 + 1.3);
  const riverHalfWidth = (z) => 19 + 5 * Math.sin(z * 0.004 + 0.7);
  const BRIDGE_Z = 25,
    PAG_Z = -70,
    PAG = { x: 0, z: PAG_Z };
  PAG.x = riverCenterX(PAG_Z) + riverHalfWidth(PAG_Z) + 27;
  const TOWN = { z0: -200, z1: -470 };
  function vwidth(x, z) {
    return 62 + fbm(x * 0.004, z * 0.004, 3, 5) * 30;
  }
  function heightFn(x, z) {
    const c = riverCenterX(z),
      w = riverHalfWidth(z);
    const d = Math.abs(x - c) + fbm(x * 0.02, z * 0.02, 2, 3) * 2.5;
    let h;
    if (d < w) {
      const t = d / w;
      h = lerp(-2.7, -0.3, smooth(0.5, 1, t)) + fbm(x * 0.05, z * 0.05, 2, 8) * 0.25;
    } else {
      const e = d - w;
      h = -0.3 + smooth(0, 6, e) * 1.5 + e * 0.012;
      const vw = vwidth(x, z);
      h +=
        smooth(vw, vw + 480, e) *
          (40 +
            (fbm(x * 0.0035, z * 0.0035, 5, 7) * 0.5 + 0.5) * 80 +
            ridged(x * 0.004, z * 0.004, 3, 7) * 30) +
        Math.max(0, e - vw) * 0.1;
      h += fbm(x * 0.03, z * 0.03, 3, 9) * 0.7 * smooth(3, 12, e);
    }
    const dp = Math.hypot(x - PAG.x, z - PAG.z);
    h += 8 * smooth(42, 14, dp);
    const far = smooth(450, 1200, Math.abs(x - c));
    if (far > 0)
      h +=
        far *
        ((fbm(x * 0.0011, z * 0.0011, 5, 21) * 0.5 + 0.5) * 420 +
          Math.pow(ridged(x * 0.0009, z * 0.0009, 3, 23), 2) * 160);
    return h;
  }
  const CELL = quality.cell,
    GX = Math.round(1600 / CELL) + 1,
    GZ = Math.round(2900 / CELL) + 1,
    X0 = (-(GX - 1) * CELL) / 2,
    Z0 = -2400;
  const heights = new Float32Array(GX * GZ);
  function groundAt(x, z) {
    const gx = clamp((x - X0) / CELL, 0, GX - 1.001),
      gz = clamp((z - Z0) / CELL, 0, GZ - 1.001);
    const ix = gx | 0,
      iz = gz | 0,
      fx = gx - ix,
      fz = gz - iz,
      i = iz * GX + ix;
    const a = heights[i],
      b = heights[i + 1],
      c = heights[i + GX],
      d = heights[i + GX + 1];
    return a + (b - a) * fx + (c - a) * fz + (a - b - c + d) * fx * fz;
  }
  function slopeNY(x, z) {
    const e = 2,
      sx = (groundAt(x + e, z) - groundAt(x - e, z)) / (2 * e),
      sz = (groundAt(x, z + e) - groundAt(x, z - e)) / (2 * e);
    return 1 / Math.sqrt(1 + sx * sx + sz * sz);
  }
  const bankE = (x, z) => Math.abs(x - riverCenterX(z)) - riverHalfWidth(z);

  const t0 = performance.now();
  for (let iz = 0; iz < GZ; iz++)
    for (let ix = 0; ix < GX; ix++) heights[iz * GX + ix] = heightFn(X0 + ix * CELL, Z0 + iz * CELL);
  const terrainColors = new Float32Array(GX * GZ * 3),
    mask = new Uint8Array(GX * GZ * 4);
  {
    const bed = [0.07, 0.065, 0.05],
      mud = [0.12, 0.1, 0.07],
      lush = [0.06, 0.12, 0.03],
      moss = [0.045, 0.085, 0.025],
      forest = [0.03, 0.055, 0.022],
      rock = [0.14, 0.135, 0.125],
      path = [0.17, 0.14, 0.1];
    const m3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
    for (let iz = 0; iz < GZ; iz++)
      for (let ix = 0; ix < GX; ix++) {
        const i = iz * GX + ix,
          x = X0 + ix * CELL,
          z = Z0 + iz * CELL,
          h = heights[i];
        const hx0 = heights[iz * GX + Math.max(ix - 1, 0)],
          hx1 = heights[iz * GX + Math.min(ix + 1, GX - 1)],
          hz0 = heights[Math.max(iz - 1, 0) * GX + ix],
          hz1 = heights[Math.min(iz + 1, GZ - 1) * GX + ix];
        const sx = (hx1 - hx0) / (2 * CELL),
          sz = (hz1 - hz0) / (2 * CELL),
          ny = 1 / Math.sqrt(1 + sx * sx + sz * sz);
        const e = bankE(x, z),
          vw = vwidth(x, z),
          n = fbm(x * 0.02, z * 0.02, 2, 11) * 0.5 + 0.5;
        let c = m3(lush, moss, n);
        c = m3(c, forest, smooth(vw - 10, vw + 40, e));
        c = m3(c, mud, smooth(1.2, 0.2, h));
        {
          const gv =
            smooth(-0.7, -0.15, h) * smooth(1.1, 0.45, h) * (0.75 + 0.25 * fbm(x * 0.15, z * 0.15, 2, 31));
          const sp = hash2(Math.floor(x * 2), Math.floor(z * 2), 7) * 0.35 + 0.8;
          c = m3(c, [0.21 * sp, 0.2 * sp, 0.18 * sp], gv);
        }
        if (h < -0.2) c = m3(mud, bed, smooth(-0.2, -2, h));
        c = m3(c, rock, smooth(0.8, 0.62, ny));
        const town = e > 1 && e < 50 && x < riverCenterX(z) && z < TOWN.z0 && z > TOWN.z1;
        if (town) c = m3(c, path, 0.6 * smooth(50, 40, e));
        terrainColors[i * 3] = c[0];
        terrainColors[i * 3 + 1] = c[1];
        terrainColors[i * 3 + 2] = c[2];
        const clump = smooth(-0.15, 0.25, fbm(x * 0.07, z * 0.07, 3, 13));
        let reed = smooth(-2.6, -1, e) * smooth(9, 3.5, e) * clump;
        if (Math.abs(z - BRIDGE_Z) < 9) reed = 0;
        if (town && e < 14) reed *= 0.25;
        let grass = smooth(0.5, 3, e) * smooth(vw + 30, vw, e) * smooth(0.75, 0.9, ny) * (0.55 + 0.45 * n);
        if (town) grass *= 0.2;
        mask[i * 4] = reed * 255;
        mask[i * 4 + 1] = grass * 255;
        mask[i * 4 + 2] = n * 255;
        mask[i * 4 + 3] = 255;
      }
  }

  // ============================================================
  // 描画の準備
  // レンダラー・シーン・カメラ・太陽光と、シェーダで共有するユニフォーム（shared）、共通のGLSL関数。
  // ============================================================
  const canvas = document.getElementById("gl");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance" });
  renderer.setPixelRatio(quality.pr);
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.85;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0xbac6cc, 0.0011);
  const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.2, 30000);
  const sunLight = new THREE.DirectionalLight(0xffffff, 3);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(quality.shadow, quality.shadow);
  {
    const c = sunLight.shadow.camera;
    c.left = -45;
    c.right = 45;
    c.top = 45;
    c.bottom = -45;
    c.near = 1;
    c.far = 600;
  }
  sunLight.shadow.bias = -0.0005;
  sunLight.shadow.normalBias = 0.03;
  scene.add(sunLight, sunLight.target);
  const hemi = new THREE.HemisphereLight(0xa8c4e0, 0x4d4a30, 1.1);
  scene.add(hemi);

  const hTex = new THREE.DataTexture(heights, GX, GZ, THREE.RedFormat, THREE.FloatType);
  hTex.minFilter = hTex.magFilter = THREE.NearestFilter;
  hTex.needsUpdate = true;
  const mTex = new THREE.DataTexture(mask, GX, GZ, THREE.RGBAFormat);
  mTex.minFilter = mTex.magFilter = THREE.LinearFilter;
  mTex.needsUpdate = true;
  const shared = {
    uTime: { value: 0 },
    uSunDir: { value: new V3(0, 1, 0) },
    uSunCol: { value: new THREE.Color() },
    uSky: { value: new THREE.Color() },
    uFogColor: { value: new THREE.Color() },
    uFogDensity: { value: 0.001 },
    uHeight: { value: hTex },
    uMask: { value: mTex },
    uHInfo: { value: new THREE.Vector4(X0, Z0, CELL, 0) },
    uHSize: { value: new THREE.Vector2(GX, GZ) },
    uRain: { value: 0 },
    uNight: { value: 0 },
    uWind: { value: 1 },
  };
  const NOISE = `
    float hash12(vec2 p){
      vec3 p3=fract(vec3(p.xyx)*.1031);
      p3+=dot(p3,p3.yzx+33.33);
      return fract((p3.x+p3.y)*p3.z);
    }
    float hash13(vec3 p3){
      p3=fract(p3*.1031);
      p3+=dot(p3,p3.zyx+31.32);
      return fract((p3.x+p3.y)*p3.z);
    }
    float vnoise(vec2 p){
      vec2 i=floor(p),f=fract(p);
      vec2 u=f*f*(3.-2.*f);

  const COMMON =

  {

          c = a + GX,

        idx[k++] = c;
        idx[k++] = b;
        idx[k++] = b;
        idx[k++] = c;

  // ============================================================
  // 葦と草
  // 1本ずつ板ポリゴンで描き、カメラの周りにタイル状に敷き詰める（位置はGPU側で折り返す）。
  // 風の波、密度マスク、遠近で切り替わる3層（手前の葦・手前の草・遠くの草）。
  // ============================================================
  function bladeGeo(seg) {
    const pos = [],
      idx = [];
    for (let i = 0; i < seg; i++) {
      const t = i / seg,
        w = 0.5 * (1 - Math.pow(t, 1.4));
      pos.push(-w, t, 0, w, t, 0);
    }
    pos.push(0, 1, 0);
    for (let i = 0; i < seg - 1; i++) {
      const a = i * 2;
      idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
    const a = (seg - 1) * 2;
    idx.push(a, a + 1, a + 2);
    return { pos, idx };
  }
  function makeBlades(count, size, seg, w, h, fade, ch, tipA, tipB, bend) {
    const g = new THREE.InstancedBufferGeometry();

    for (let i = 0; i < count; i++) {
      inst[i * 4] = rand01() * size;
      inst[i * 4 + 1] = rand01() * size;
      inst[i * 4 + 2] = rand01();
      inst[i * 4 + 3] = rand01();
    }

      side: THREE.DoubleSide,
      uniforms: {
        ...shared,
        uCam: { value: new V3() },
        uSize: { value: size },
        uW: { value: w },
        uH: { value: h },
        uF: { value: new THREE.Vector4(...fade) },
        uCh: { value: new THREE.Vector4(...ch) },
        uTipA: { value: new THREE.Color(tipA) },
        uTipB: { value: new THREE.Color(tipB) },

        `
          uniform vec3 uCam,uTipA,uTipB;
          uniform float uSize,uW,uH,uBend;
          uniform vec4 uF,uCh;
          attribute vec4 aI;
          varying vec3 vCol;
          varying float vT;
          varying vec3 vWP;
          void main(){
            vec2 p=aI.xy+uSize*floor((uCam.xz-aI.xy)/uSize+.5);

            float ht=uH*(.5+.8*aI.w)*(.6+.4*dens)*s;
            float a=aI.z*57.+aI.w*23.;

            vec2 sd=vec2(-dir.y,dir.x);

#include <tonemapping_fragment>

  // ============================================================
  // 水面
  // 景色を上下反転で別に描いたテクスチャを映し込み、波・航跡・雨の波紋・舳先の波・棹の波紋を法線で表す。

  const reflRT = new THREE.WebGLRenderTarget(2, 2, { type: THREE.HalfFloatType });

#include <tonemapping_fragment>
#include <colorspace_fragment>
          }
          `,

  water.position.set(0, 0, -950);
  scene.add(water);

      e = new THREE.Euler(),

      const b = blobs[(rand01() * blobs.length) | 0];

      do {
        x = randRange(-1, 1);
        y = randRange(-1, 1);
        z = randRange(-1, 1);

  // ============================================================

  let boatLantern = null;

  function swayPatch(mat, top, bottom, amt) {
    mat.onBeforeCompile = (sh) => {

      sh.vertexShader = sh.vertexShader

#include <begin_vertex>
            float sk=smoothstep(${top.toFixed(3)},${bottom.toFixed(3)},position.y);
            float sw=${amt.toFixed(3)}*sk*(.5+.5*uSwayW);
            transformed.x+=sin(uSwayT*1.9+position.y*4.+position.z*3.)*sw;
            transformed.z+=(sin(uSwayT*1.4+position.x*5.)*.5-.7)*sw;

  const oldWoodTex = canvasTex(

  const BOAT_LENGTH = 8.6;

    // 舷縁板（船べりに沿った幅広の板）

    for (const sd of [-1, 1]) {
      for (let i = 0; i <= NS; i++) {
        const s = i / NS,

    const caps = new THREE.Mesh(cg, hullMat);

    // 肋材・梁・床板・船尾の立ち台

    const cz0 = -0.95,

  const colorKeys = ["sunCol", "hSky", "hGnd", "zen", "hor", "fog", "mistCol", "cloudCol"];
  function initW(k) {
    const p = PRESETS[k];
    for (const key in p) {
      if (key === "label") continue;
      if (colorKeys.includes(key)) weather[key] = new THREE.Color(p[key]);
      else if (key === "sun") weather.sun = new V3(...p.sun).normalize();
      else weather[key] = p[key];
    }
  }
  let weatherKey = "clear",
    autoCycle = false,
    autoT = 0;
  initW("clear");
  function setWeather(k) {
    if (k === "auto") {
      autoCycle = !autoCycle;
      autoT = 0;
    } else {
      weatherKey = k;
      autoCycle = false;
    }
    refreshChips();
  }
  function refreshChips() {
    document
      .querySelectorAll("#wx button")
      .forEach((b) =>
        b.classList.toggle(
          "on",
          b.dataset.w === (autoCycle ? "auto" : weatherKey) || (autoCycle && b.dataset.w === weatherKey),
        ),
      );
    document.getElementById("wlabel").textContent = PRESETS[weatherKey].label;
  }
  const _c = new THREE.Color();
  function stepWeather(dt) {
    if (autoCycle) {
      autoT += dt;
      if (autoT > 18) {
        autoT = 0;
        weatherKey = ORDER[(ORDER.indexOf(weatherKey) + 1) % ORDER.length];
        refreshChips();
      }
    }
    const p = PRESETS[weatherKey],
      k = 1 - Math.exp(-dt * 0.9);
    for (const key in p) {
      if (key === "label") continue;
      if (colorKeys.includes(key)) weather[key].lerp(_c.set(p[key]), k);
      else if (key === "sun") weather.sun.lerp(_v.set(...p.sun).normalize(), k).normalize();
      else weather[key] = lerp(weather[key], p[key], k);
    }
    shared.uSunDir.value.copy(weather.sun);
    shared.uSunCol.value.copy(weather.sunCol).multiplyScalar(weather.sunI / Math.PI);
    shared.uSky.value.copy(weather.hSky).multiplyScalar((weather.hI / Math.PI) * 1.4);
    shared.uFogColor.value.copy(weather.fog);
    shared.uFogDensity.value = weather.fogD;
    scene.fog.color.copy(weather.fog);
    scene.fog.density = weather.fogD;
    shared.uRain.value = weather.rain;
    shared.uNight.value = weather.night;
    shared.uWind.value = weather.wind;
    sunLight.color.copy(weather.sunCol);
    sunLight.intensity = weather.sunI;
    hemi.color.copy(weather.hSky);
    hemi.groundColor.copy(weather.hGnd);
    hemi.intensity = weather.hI;
    skyU.uZen.value.copy(weather.zen);
    skyU.uHor.value.copy(weather.hor);
    skyU.uCloudCol.value.copy(weather.cloudCol);
    skyU.uCloud.value = weather.cloud;
    skyU.uStars.value = weather.stars;
    skyU.uSunDisc.value = weather.disc;
    renderer.toneMappingExposure = weather.exp;
    bloom.strength = weather.bloom;
    atmos.uniforms.uMist.value = weather.mist;
    atmos.uniforms.uMistCol.value.copy(weather.mistCol);
    atmos.uniforms.uGod.value = weather.god;
    for (const [m, d, n] of glowMats) m.emissiveIntensity = lerp(d, n, weather.lamp);
    blossomMat.emissiveIntensity = 0.5 + weather.god * 0.7;
    bowLight.intensity = weather.lamp * 14;
    rain.material.uniforms.uCol.value.copy(weather.hSky).multiplyScalar(0.9);
    lanterns.visible = weather.lamp > 0.5;
    lanterns2.visible = weather.lamp > 0.5;
    fireflies.visible = weather.night > 0.02;
    rain.visible = weather.rain > 0.02;
    waterU.uDeep.value.setRGB(0.012, 0.05, 0.04);
    waterU.uShal.value.setRGB(0.06, 0.11, 0.07);
  }

  // ============================================================
  // 仕上げの画面処理
  // シーンを深度付きで描いたあと、霧と光芒 → 光のにじみ → トーンマップ → アンチエイリアス → 周辺減光と色調。
  // ============================================================
  const rt = new THREE.WebGLRenderTarget(2, 2, { type: THREE.HalfFloatType });
  rt.depthTexture = new THREE.DepthTexture(2, 2);
  rt.depthTexture.type = THREE.UnsignedIntType;
  const composer = new EffectComposer(renderer);
  const atmos = new ShaderPass(
    {
      uniforms: {
        tScene: { value: rt.texture },
        tDepth: { value: rt.depthTexture },
        uInvProj: { value: new THREE.Matrix4() },
        uCamWorld: { value: new THREE.Matrix4() },
        uCamPos: { value: new V3() },
        uSunDir: shared.uSunDir,
        uSunCol: shared.uSunCol,
        uMistCol: { value: new THREE.Color() },
        uSunUV: { value: new THREE.Vector2() },
        uSunVis: { value: 0 },
        uGod: { value: 0 },
        uMist: { value: 0 },
        uFogD: shared.uFogDensity,
        uFogCol: shared.uFogColor,
      },
      vertexShader: `
        varying vec2 vUv;
        void main(){
          vUv=uv;
          gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);
        }
        `,
      fragmentShader: `
        uniform sampler2D tScene,tDepth;
        uniform mat4 uInvProj,uCamWorld;
        uniform vec3 uCamPos,uSunDir,uSunCol,uMistCol;
        uniform vec2 uSunUV;
        uniform float uSunVis,uGod,uMist,uFogD;
        uniform vec3 uFogCol;
        varying vec2 vUv;
        void main(){
          vec4 c=texture2D(tScene,vUv);
          float d=texture2D(tDepth,vUv).x;
          vec4 v=uInvProj*vec4(vUv*2.-1.,min(d,.999999)*2.-1.,1.);
          v/=v.w;
          vec3 wp=(uCamWorld*v).xyz;
          vec3 ray=wp-uCamPos;
          float dist=length(ray);
          vec3 rd=ray/dist;
          if(d>=.999999)dist=4000.;
          float Hm=4.5;
          float y0=max(uCamPos.y,0.);
          float y1=max(y0+rd.y*dist,0.);
          float dens;
          if(abs(rd.y)>.002)dens=Hm*(exp(-y0/Hm)-exp(-y1/Hm))/rd.y;
          else dens=dist*exp(-y0/Hm);
          dens=max(dens,0.)*.0072*uMist;
          if(d>=.999999){
            float hf=(1.-exp(-uFogD*uFogD*1.6e7))*exp(-max(rd.y,0.)*mix(12.,3.,clamp(uFogD*260.,0.,1.)));
            c.rgb=mix(c.rgb,uFogCol,hf*.85);
          }
          float mf=1.-exp(-dens);
          float sa=pow(max(dot(rd,uSunDir),0.),8.);
          c.rgb=mix(c.rgb,uMistCol+uSunCol*sa*.9,clamp(mf,0.,.93));
          if(uGod>.001&&uSunVis>.001){
            vec2 dl=(uSunUV-vUv)/56.;
            vec2 uv=vUv;
            float il=1.,acc=0.;
            for(int i=0;i<56;i++){
              uv+=dl;
              float sd=texture2D(tDepth,clamp(uv,.001,.999)).x;
              acc+=step(.999999,sd)*il;
              il*=.968;
            }
            acc/=56.;
            float fall=pow(max(dot(rd,uSunDir),0.),3.);
            c.rgb+=uSunCol*acc*uGod*uSunVis*(.45+1.4*fall)*(1.-step(.999999,d)*.6)*(1.+mf*1.5);
          }
          gl_FragColor=c;
        }
        `,
    },
    "tNone",
  );
  composer.addPass(atmos);
  const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.4, 0.45, 0.95);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
  const fxaa = new ShaderPass(FXAAShader);
  composer.addPass(fxaa);
  const finalPass = new ShaderPass({
    uniforms: { tDiffuse: { value: null }, uTime: shared.uTime },
    vertexShader: `
      varying vec2 vUv;
      void main(){
        vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);
      }
      `,
    fragmentShader: `
      uniform sampler2D tDiffuse;
      uniform float uTime;
      varying vec2 vUv;
      float h(vec2 p){
        return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);
      }
      void main(){
        vec4 c=texture2D(tDiffuse,vUv);
        float v=smoothstep(1.05,.3,length((vUv-.5)*vec2(1.25,1.)));
        c.rgb*=mix(.62,1.,v);
        float lu=dot(c.rgb,vec3(.299,.587,.114));
        c.rgb=mix(vec3(lu),c.rgb,.86);
        c.rgb+=vec3(-.012,0.,.018)*(1.-lu)+vec3(.02,.008,-.012)*lu;
        c.rgb=mix(c.rgb,c.rgb*c.rgb*(3.-2.*c.rgb),.38);
        c.rgb+=(h(vUv*1000.+fract(uTime))-.5)*.022;
        gl_FragColor=c;
      }
      `,
  });
  composer.addPass(finalPass);
  function resize() {
    const w = innerWidth,
      h = innerHeight,
      pr = Math.min(quality.pr, Math.sqrt((isMobile ? 1.2e6 : 2.2e6) / (w * h)));
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(pr);
    renderer.setSize(w, h);
    rt.setSize((w * pr) | 0, (h * pr) | 0);
    composer.setPixelRatio(pr);
    composer.setSize(w, h);
    reflRT.setSize(Math.max(2, (w * pr * quality.refl) | 0), Math.max(2, (h * pr * quality.refl) | 0));
    fxaa.uniforms.resolution.value.set(1 / (w * pr), 1 / (h * pr));
    bloom.resolution.set((w * pr) / 2, (h * pr) / 2);
  }
  resize();
  addEventListener("resize", resize);

  // ============================================================
  // 映り込み用の描画
  // 水面を境に鏡写しのカメラで景色を描き、水のシェーダに渡す。
  // ============================================================
  const mirror = new THREE.PerspectiveCamera();
  const clip = new THREE.Plane(new V3(0, 1, 0), 0.05);
  const bias = new THREE.Matrix4().set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1);
  const hideInRefl = [...blades, water, rain, petalMesh, fireflies];
  function renderReflection() {
    const cp = camera.position;
    mirror.position.set(cp.x, -cp.y, cp.z);
    const dir = camera.getWorldDirection(_v).clone();
    dir.y *= -1;
    const up = _v2.set(0, 1, 0).applyQuaternion(camera.quaternion);
    up.y *= -1;
    mirror.up.copy(up);
    mirror.lookAt(mirror.position.clone().add(dir));
    mirror.projectionMatrix.copy(camera.projectionMatrix);
    mirror.updateMatrixWorld();
    mirror.matrixWorldInverse.copy(mirror.matrixWorld).invert();
    texMat.copy(bias).multiply(mirror.projectionMatrix).multiply(mirror.matrixWorldInverse);
    hideInRefl.forEach((o) => (o.visible = false));
    const ff = weather.night > 0.02;
    fireflies.visible = ff;
    sky.position.copy(mirror.position);
    renderer.setRenderTarget(reflRT);
    renderer.clippingPlanes = [clip];
    renderer.render(scene, mirror);
    renderer.clippingPlanes = [];
    renderer.setRenderTarget(null);
    hideInRefl.forEach((o) => (o.visible = true));
    rain.visible = weather.rain > 0.02;
    sky.position.copy(camera.position);
  }

  // ============================================================
  // 音
  // 音声ファイルは使わず、ノイズと発振器で川の音・雨・鳥・虫・棹の水音をその場で合成する。
  // ============================================================
  const sound = {
    ctx: null,
    init() {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      try {
        this.ctx = new C();
      } catch (e) {
        return;
      }
      const c = this.ctx;
      this.m = c.createGain();
      this.m.gain.value = 0.8;
      this.m.connect(c.destination);
      const len = c.sampleRate * 2,
        b = c.createBuffer(1, len, c.sampleRate),
        d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = b;
      const loop = (type, f, q) => {
        const s = c.createBufferSource();
        s.buffer = b;
        s.loop = true;
        const fl = c.createBiquadFilter();
        fl.type = type;
        fl.frequency.value = f;
        fl.Q.value = q;
        const g = c.createGain();
        g.gain.value = 0;
        s.connect(fl);
        fl.connect(g);
        g.connect(this.m);
        s.start(0, Math.random());
        return g;
      };
      this.flow = loop("lowpass", 420, 0.7);
      this.rainG = loop("bandpass", 2600, 0.4);
      this.rainLow = loop("lowpass", 900, 0.5);
      this.birdT = 2;
      this.bugT = 1;
    },
    burst(t, type, f, q, a, dec, gain) {
      const c = this.ctx,
        s = c.createBufferSource();
      s.buffer = this.noise;
      const fl = c.createBiquadFilter();
      fl.type = type;
      fl.frequency.value = f;
      fl.Q.value = q;
      const g = c.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(gain, t + a);
      g.gain.exponentialRampToValueAtTime(0.0008, t + a + dec);
      s.connect(fl);
      fl.connect(g);
      g.connect(this.m);
      s.start(t, Math.random());
      s.stop(t + a + dec + 0.05);
    },
    tone(t, f0, f1, dur, gain) {
      const c = this.ctx,
        o = c.createOscillator(),
        g = c.createGain();
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
      o.connect(g);
      g.connect(this.m);
      o.start(t);
      o.stop(t + dur + 0.02);
    },
    splash() {
      if (!this.ctx) return;
      const t = this.ctx.currentTime + 0.01;
      this.burst(t, "lowpass", 1400, 0.7, 0.01, 0.35, 0.35);
      this.tone(t + 0.03, 380, 700, 0.08, 0.05);
      this.burst(t + 0.08, "bandpass", 600, 1.5, 0.01, 0.25, 0.12);
    },
    update(dt) {
      if (!this.ctx) return;
      const c = this.ctx,
        t = c.currentTime;
      this.flow.gain.setTargetAtTime(0.1 + boatState.v * 0.03, t, 0.3);
      this.rainG.gain.setTargetAtTime(weather.rain * 0.16, t, 0.5);
      this.rainLow.gain.setTargetAtTime(weather.rain * 0.12, t, 0.5);
      this.birdT -= dt;
      if (this.birdT < 0) {
        this.birdT = randRange(2, 7);
        if (weather.night < 0.5 && weather.rain < 0.5) {
          const n = 2 + ((Math.random() * 4) | 0),
            b = randRange(2600, 4200);
          for (let i = 0; i < n; i++)
            this.tone(
              t + i * 0.12,
              b * randRange(1, 1.2),
              b * randRange(1.2, 1.5),
              randRange(0.06, 0.1),
              0.035,
            );
        }
      }
      this.bugT -= dt;
      if (this.bugT < 0) {
        this.bugT = randRange(0.3, 1.2);
        if (weather.night > 0.5) {
          for (let i = 0; i < 3; i++) this.tone(t + i * 0.05, 4400, 4300, 0.035, 0.012);
        }
      }
    },
  };

  // ============================================================
  // 舟と漕ぎ手の動き
  // 自動航行（操作が6秒ないと川の中心線をたどる）、棹を突いて押して抜く一連の動作、腕は2関節IK。
  // ============================================================
  const keys = {};
  let camYaw = Math.PI,
    camPitch = 0.16,
    camDist = 13.5,
    camDistT = 13.5,
    userT = 0,
    cine = false,
    started = false;
  const joy = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
  let lookId = null,
    lx = 0,
    ly = 0;
  function boatStep(dt) {
    let fw = 0,
      turn = 0;
    if (keys.KeyW || keys.ArrowUp) fw += 1;
    if (keys.KeyS || keys.ArrowDown) fw -= 1;
    if (keys.KeyA || keys.ArrowLeft) turn += 1;
    if (keys.KeyD || keys.ArrowRight) turn -= 1;
    if (joy.id !== null) {
      fw -= joy.y;
      turn -= joy.x;
    }
    if (fw || turn) {
      boatState.autoT = 6;
    }
    boatState.autoT -= dt;
    const auto = boatState.autoT <= 0;
    const tgt = auto ? 2.6 : clamp(2.6 + fw * 2.3, 0.4, 5);
    const pulse = sendo.state === "push" ? 1 : 0.55;
    boatState.v += (tgt * (0.8 + 0.35 * pulse) - boatState.v) * dt * 0.7;
    let yawRate;
    if (auto) {
      const za = boatState.z - 18,
        xa = riverCenterX(za);
      const des = Math.atan2(xa - boatState.x, za - boatState.z);
      yawRate = clamp(wrapA(des - boatState.yaw) * 0.9, -0.3, 0.3);
    } else yawRate = turn * 0.42 * (0.35 + boatState.v / 4.5);
    boatState.yawV = lerp(boatState.yawV, yawRate, Math.min(1, dt * 2));
    boatState.yaw += boatState.yawV * dt;
    boatState.x += Math.sin(boatState.yaw) * boatState.v * dt;
    boatState.z += Math.cos(boatState.yaw) * boatState.v * dt;
    const lat = boatState.x - riverCenterX(boatState.z),
      lim = riverHalfWidth(boatState.z) - 3.4;
    if (Math.abs(lat) > lim) {
      boatState.x = riverCenterX(boatState.z) + Math.sign(lat) * lim;
      boatState.v *= 0.985;
      boatState.yaw +=
        wrapA(Math.atan2(riverCenterX(boatState.z - 10) - boatState.x, -10) - boatState.yaw) * dt;
    }
    const bc = riverCenterX(BRIDGE_Z),
      bw = riverHalfWidth(BRIDGE_Z);
    if (Math.abs(boatState.z - BRIDGE_Z) < 2.5 && Math.abs(boatState.x - bc) > bw * 0.42) {
      boatState.x = bc + Math.sign(boatState.x - bc) * bw * 0.42;
    }
    if (boatState.z < -2150) loopRiver();
    const T = shared.uTime.value;
    boat.position.set(boatState.x, 0.06 + Math.sin(T * 1.3) * 0.03, boatState.z);
    boat.rotation.set(
      0.012 * Math.sin(T * 0.9) + (sendo.state === "push" ? -0.006 : 0),
      boatState.yaw,
      0.018 * Math.sin(T * 1.1) - boatState.yawV * 0.08,
      "YXZ",
    );
    if (boatLantern) {
      boatLantern.rotation.z = Math.sin(T * 1.7) * 0.06 - boatState.yawV * 0.3;
      boatLantern.rotation.x = Math.sin(T * 1.3 + 1) * 0.05 - (boatState.v - 2.6) * 0.02;
    }
    boat.updateMatrixWorld(true);
  }
  let looping = false;
  function loopRiver() {
    if (looping) return;
    looping = true;
    const f = document.getElementById("fade");
    f.style.opacity = 1;
    setTimeout(() => {
      boatState.z = 150;
      boatState.x = riverCenterX(150);
      boatState.yaw = Math.PI;
      camYaw = Math.PI;
      sendo.state = "push";
      sendo.planted = false;
      f.style.opacity = 0;
      looping = false;
    }, 950);
  }
  const _v = new V3(),
    _v2 = new V3(),
    _v3 = new V3(),
    _q = new THREE.Quaternion(),
    UP = new V3(0, 1, 0);
  function place(mesh, a, b, len) {
    mesh.position.addVectors(a, b).multiplyScalar(0.5);
    _v3.subVectors(b, a);
    const l = _v3.length();
    mesh.quaternion.setFromUnitVectors(UP, _v3.normalize());
    mesh.scale.set(1, l / len, 1);
  }
  function ik(S, T, L1, L2, hint, out) {
    const d = clamp(S.distanceTo(T), 0.05, L1 + L2 - 0.001);
    const dir = _v3.subVectors(T, S).normalize();
    const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(L1 * L1 - a * a, 0));
    const perp = hint.clone().addScaledVector(dir, -hint.dot(dir)).normalize();
    return out.copy(S).addScaledVector(dir, a).addScaledVector(perp, h);
  }
  function sendoStep(dt) {
    const s = sendo;
    const toW = (v) => v.applyMatrix4(boat.matrixWorld);
    const toL = (v) => boat.worldToLocal(v);
    const plantL = new V3(-1.12, 0, -2.15); // local plant point (right side, ahead of the ferryman)
    if (!s.planted) {
      const w = toW(plantL.clone());
      w.y = Math.max(groundAt(w.x, w.z), -3.4);
      s.bottomW.copy(w);
      s.planted = true;
      s.state = "push";
    }
    let bL, handL;
    const zF = -BOAT_LENGTH / 2 + 0.72;
    if (s.state === "push") {
      bL = toL(s.bottomW.clone());
      const back = clamp((bL.z - plantL.z) / -2.6, 0, 1);
      handL = new V3(-0.42, STERN_DECK + 1.25 - back * 0.05, zF + 0.35 - back * 0.75);
      if (bL.z < zF - 1.9 || bL.distanceTo(handL) > 5.2) {
        s.state = "lift";
        s.t = 0;
        s.liftFrom = bL.clone();
      }
    }
    if (s.state === "lift") {
      s.t += dt / 1.15;
      const e = s.t * s.t * (3 - 2 * s.t);
      bL = s.liftFrom.clone().lerp(new V3(plantL.x, -0.6, plantL.z), e);
      bL.y += Math.sin(Math.PI * s.t) * 1.4;
      bL.x -= Math.sin(Math.PI * s.t) * 0.3;
      handL = new V3(-0.42, STERN_DECK + 1.25 + Math.sin(Math.PI * s.t) * 0.25, lerp(zF - 0.4, zF + 0.35, e));
      if (s.t >= 1) {
        const w = toW(plantL.clone());
        w.y = Math.max(groundAt(w.x, w.z), -3.4);
        s.bottomW.copy(w);
        s.state = "push";
        waterU.uPole.value.set(w.x, w.z, shared.uTime.value, 1);
        sound.splash();
      }
    }
    const bW = toW(bL.clone()),
      hW = toW(handL.clone());
    const dir = _v.subVectors(hW, bW).normalize();
    const top = bW.clone().addScaledVector(dir, 6);
    place(s.pole, bW, top, 6);
    const push = s.state === "push" ? clamp((toL(s.bottomW.clone()).z - plantL.z) / -2.6, 0, 1) : 0;
    s.torso.rotation.set(0.08 + push * 0.2 - (s.state === "lift" ? 0.06 : 0), -0.3, -0.05);
    s.hips.rotation.set(0, 0.2, 0);
    s.head.rotation.set(-0.15 - push * 0.2, 0.35, 0);
    s.legs[0][0].rotation.x = -0.35 - push * 0.2;
    s.legs[0][1].rotation.x = 0.55 + push * 0.2;
    s.legs[1][0].rotation.x = 0.25;
    s.legs[1][1].rotation.x = 0.2;
    s.root.updateMatrixWorld(true);
    const g1 = hW.clone(),
      g2 = hW.clone().addScaledVector(dir, -0.42);
    for (let i = 0; i < 2; i++) {
      const S = s.sh[i].clone().applyMatrix4(s.torso.matrixWorld);
      const Tg = i === 0 ? g2 : g1;
      const hint = _v2
        .set(0, -1, 0)
        .addScaledVector(new V3(Math.sin(boatState.yaw), 0, Math.cos(boatState.yaw)), -0.5);
      const E = ik(S, Tg, 0.3, 0.28, hint, new V3());
      const [u, f, h] = s.arm[i];
      place(u, S, E, 0.36);
      place(f, E, Tg, 0.33);
      h.position.copy(Tg);
      [u, f, h].forEach((o) => {
        o.parent !== scene && scene.attach(o);
      });
    }
  }
  // 腕は舟の子として作ったので、一度だけシーン直下に移す（IKはワールド座標で計算）
  sendo.arm.forEach((a) => a.forEach((o) => scene.attach(o)));

  const _hideM = new THREE.Matrix4().makeScale(0, 0, 0);
  function propsStep(dt) {
    const T = shared.uTime.value,
      d = new THREE.Object3D();
    // 花びら
    const wind = weather.wind,
      active = Math.floor(PETALS * weather.petal);
    for (let i = 0; i < PETALS; i++) {
      const p = petals[i];
      if (i >= active) {
        d.position.set(0, -99, 0);
        d.scale.setScalar(0);
        d.updateMatrix();
        petalMesh.setMatrixAt(i, d.matrix);
        continue;
      }
      if (p.float > 0) {
        p.float -= dt;
        p.z -= 0.5 * dt;
        p.x += Math.sin(T * 0.3 + p.ph) * 0.05 * dt;
        p.y = 0.03;
        if (p.float <= 0) spawnPetal(p);
      } else {
        p.ph += dt * p.rs;
        p.x += (p.vx + Math.sin(p.ph) * 0.6 + 0.5 * wind) * dt;
        p.z += (p.vz + Math.cos(p.ph * 0.7) * 0.5 + 0.3 * wind) * dt;
        p.y -= (0.55 + weather.rain * 1.5) * dt;
        p.rx += dt * p.rs * 2;
        p.rz += dt * p.rs;
        const g = groundAt(p.x, p.z);
        if (p.y < Math.max(g, 0)) {
          if (g < 0) {
            p.float = randRange(15, 40);
            p.y = 0.03;
            p.rx = Math.PI / 2;
            p.rz = randRange(0, 6);
          } else spawnPetal(p);
        }
      }
      if (
        Math.abs(p.x - boatState.x) > 70 ||
        Math.abs(p.z - boatState.z) > 90 ||
        (p.float <= 0 && camera.position.distanceToSquared(_v3.set(p.x, p.y, p.z)) < 16)
      )
        spawnPetal(p);
      d.position.set(p.x, p.y, p.z);
      d.rotation.set(p.float > 0 ? -Math.PI / 2 : p.rx, p.rz, 0);
      d.scale.setScalar(1);
      d.updateMatrix();
      petalMesh.setMatrixAt(i, d.matrix);
    }
    petalMesh.instanceMatrix.needsUpdate = true;
    // 流し灯籠
    if (lanterns.visible) {
      for (let i = 0; i < LAN; i++) {
        const l = lanS[i];
        l.z -= 0.45 * dt;
        if (l.z < boatState.z - 330 || l.z > boatState.z + 80) {
          l.z = boatState.z - randRange(200, 330);
          l.o = randRange(-0.8, 0.8);
        }
        const x = riverCenterX(l.z) + l.o * (riverHalfWidth(l.z) - 4);
        d.position.set(x, 0.02 + Math.sin(T * 1.2 + l.ph) * 0.03, l.z);
        d.rotation.set(Math.sin(T + l.ph) * 0.05, l.ph + T * 0.05, Math.cos(T * 0.8 + l.ph) * 0.05);
        d.scale.setScalar(1);
        d.updateMatrix();
        (i % 5 < 3 ? lanterns : lanterns2).setMatrixAt(i, d.matrix);
        (i % 5 < 3 ? lanterns2 : lanterns).setMatrixAt(i, _hideM);
      }
      lanterns.instanceMatrix.needsUpdate = true;
      lanterns2.instanceMatrix.needsUpdate = true;
    }
    if (fireflies.visible) {
      let ch = false;
      for (let i = 0; i < FF; i++) {
        const z = ffPos[i * 3 + 2];
        if (z > boatState.z + 50 || z < boatState.z - 240) {
          placeFF(i);
          ch = true;
        }
      }
      if (ch) ffGeo.attributes.position.needsUpdate = true;
    }
  }

  // ============================================================
  // 操作
  // キーボード・マウス・タッチ（左半分が仮想スティック、右半分が視点）。
  // ============================================================
  addEventListener("keydown", (e) => {
    keys[e.code] = true;
    if (!started) return;
    const n = {
      Digit1: "clear",
      Digit2: "golden",
      Digit3: "fog",
      Digit4: "rain",
      Digit5: "dusk",
      Digit6: "night",
    }[e.code];
    if (n) setWeather(n);
    if (e.code === "KeyT") setWeather("auto");
    if (e.code === "KeyV") cine = !cine;
    if (e.code === "KeyH") document.body.classList.toggle("clean");
  });
  addEventListener("keyup", (e) => (keys[e.code] = false));
  addEventListener("blur", () => {
    for (const k in keys) keys[k] = false;
  });
  document.querySelectorAll("#wx button").forEach((b) =>
    b.addEventListener("click", () => {
      setWeather(b.dataset.w);
      canvas.focus();
    }),
  );
  let drag = false,
    mx = 0,
    my = 0;
  canvas.addEventListener("mousedown", (e) => {
    drag = true;
    mx = e.clientX;
    my = e.clientY;
    canvas.focus();
  });
  addEventListener("mouseup", () => (drag = false));
  addEventListener("mousemove", (e) => {
    if (!drag) return;
    camYaw -= (e.clientX - mx) * 0.005;
    camPitch = clamp(camPitch + (e.clientY - my) * 0.004, -0.05, 1.1);
    mx = e.clientX;
    my = e.clientY;
    userT = 4;
  });
  canvas.addEventListener(
    "wheel",
    (e) => {
      camDistT = clamp(camDistT * (1 + Math.sign(e.deltaY) * 0.1), 5, 40);
      e.preventDefault();
    },
    { passive: false },
  );
  const knob = document.getElementById("knob"),
    knobI = knob.querySelector("i");
  canvas.addEventListener(
    "touchstart",
    (e) => {
      for (const t of e.changedTouches) {
        if (t.clientX < innerWidth * 0.45 && joy.id === null) {
          joy.id = t.identifier;
          joy.ox = t.clientX;
          joy.oy = t.clientY;
          joy.x = joy.y = 0;
          knob.hidden = false;
          knob.style.left = t.clientX + "px";
          knob.style.top = t.clientY + "px";
          knobI.style.transform = "";
        } else if (lookId === null) {
          lookId = t.identifier;
          lx = t.clientX;
          ly = t.clientY;
        }
      }
      e.preventDefault();
    },
    { passive: false },
  );
  canvas.addEventListener(
    "touchmove",
    (e) => {
      for (const t of e.changedTouches) {
        if (t.identifier === joy.id) {
          let dx = t.clientX - joy.ox,
            dy = t.clientY - joy.oy;
          const d = Math.hypot(dx, dy);
          if (d > 48) {
            dx *= 48 / d;
            dy *= 48 / d;
          }
          joy.x = dx / 48;
          joy.y = dy / 48;
          knobI.style.transform = `translate(${dx}px,${dy}px)`;
        } else if (t.identifier === lookId) {
          camYaw -= (t.clientX - lx) * 0.007;
          camPitch = clamp(camPitch + (t.clientY - ly) * 0.005, -0.05, 1.1);
          lx = t.clientX;
          ly = t.clientY;
          userT = 4;
        }
      }
      e.preventDefault();
    },
    { passive: false },
  );
  const endT = (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === joy.id) {
        joy.id = null;
        joy.x = joy.y = 0;
        knob.hidden = true;
      }
      if (t.identifier === lookId) lookId = null;
    }
  };
  canvas.addEventListener("touchend", endT);
  canvas.addEventListener("touchcancel", endT);

  // ============================================================
  // カメラ
  // 舟の斜め後ろ上から追う。ドラッグで回し、放すと元の構図に戻る。V で映画カメラ。
  // ============================================================
  const camT = new V3();
  function cameraStep(dt) {
    camDist = lerp(camDist, cine ? 17 : camDistT, Math.min(1, dt * 2));
    userT -= dt;
    if (cine) {
      camYaw += dt * 0.07;
      camPitch = lerp(camPitch, 0.1 + 0.08 * Math.sin(shared.uTime.value * 0.05), dt);
    } else if (userT <= 0) camYaw += wrapA(boatState.yaw - 0.32 - camYaw) * Math.min(1, dt * 0.8);
    camT.lerp(_v.set(boatState.x, 1.5, boatState.z), Math.min(1, dt * 6));
    const cp = Math.cos(camPitch);
    let x = camT.x - Math.sin(camYaw) * camDist * cp,
      z = camT.z - Math.cos(camYaw) * camDist * cp,
      y = camT.y + camDist * Math.sin(camPitch);
    y = Math.max(y, Math.max(groundAt(x, z), 0) + 0.6);
    camera.position.set(x, y, z);
    camera.lookAt(camT);
  }

  // ============================================================
  // メインループ
  // 天気 → 舟 → 漕ぎ手 → 舞うもの → カメラ → 映り込み → 本描画 → 仕上げ、の順に毎フレーム更新。
  // ============================================================
  const clock = new THREE.Clock();
  let fN = 0,
    fT = 0;
  const fpsEl = document.getElementById("fps");
  const invProj = new THREE.Matrix4();
  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.05);
    shared.uTime.value += dt;
    stepWeather(dt);
    boatStep(dt);
    sendoStep(dt);
    propsStep(dt);
    birdsStep(dt);
    cameraStep(dt);
    waterU.uBoat.value.set(boatState.x, boatState.z, boatState.v);
    waterU.uBoatDir.value.set(Math.sin(boatState.yaw), Math.cos(boatState.yaw));
    blades.forEach((b) => b.material.uniforms.uCam.value.copy(camera.position));
    rain.material.uniforms.uC.value.copy(camera.position);
    sky.position.copy(camera.position);
    sunLight.target.position.set(Math.round(boatState.x), 0, Math.round(boatState.z));
    sunLight.position.copy(sunLight.target.position).addScaledVector(weather.sun, 300);
    camera.updateMatrixWorld();
    renderReflection();
    const au = atmos.uniforms;
    au.uInvProj.value.copy(camera.projectionMatrixInverse);
    au.uCamWorld.value.copy(camera.matrixWorld);
    au.uCamPos.value.copy(camera.position);
    au.tScene.value = rt.texture;
    au.tDepth.value = rt.depthTexture;
    const sp = _v.copy(camera.position).addScaledVector(weather.sun, 1000).project(camera);
    au.uSunUV.value.set(sp.x * 0.5 + 0.5, sp.y * 0.5 + 0.5);
    const fwd = camera.getWorldDirection(_v2);
    au.uSunVis.value =
      smooth(-0.15, 0.3, fwd.dot(weather.sun)) * smooth(3.4, 1.2, Math.max(Math.abs(sp.x), Math.abs(sp.y)));
    renderer.shadowMap.needsUpdate = true;
    renderer.setRenderTarget(rt);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    composer.render();
    sound.update(dt);
    fN++;
    fT += dt;
    if (fT > 0.5) {
      fpsEl.textContent = `${Math.round(fN / fT)} fps`;
      fN = 0;
      fT = 0;
    }
  }
  refreshChips();
  const gen = Math.round(performance.now() - t0);
  document.getElementById("msg").textContent =
    `画像・3Dモデル・音声ファイルは使っていません。川、苫舟、船頭、太鼓橋、五重塔、桜、天気と光まで、すべてコードで生成（${gen} ms）。音が出ます。`;
  const go = document.getElementById("go");
  go.disabled = false;
  go.focus();
  let idleT = 0;
  const wake = () => {
    idleT = 0;
    document.body.classList.remove("idle");
  };
  ["mousemove", "keydown", "touchstart", "wheel"].forEach((ev) =>
    addEventListener(ev, wake, { passive: true }),
  );
  setInterval(() => {
    if (started && (idleT += 0.5) > 4) document.body.classList.add("idle");
  }, 500);
  go.addEventListener("click", () => {
    sound.init();
    started = true;
    document.getElementById("start").hidden = true;
    canvas.focus();
  });
  frame();

</script>
</body>
